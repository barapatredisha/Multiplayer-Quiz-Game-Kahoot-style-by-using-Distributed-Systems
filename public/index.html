<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Pro Multiplayer Quiz</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="container">

  <!-- JOIN -->
  <div id="join" class="card">
    <h1>Multiplayer Quiz 🎮</h1>

    <input id="name" placeholder="Enter Name">
    <input id="room" placeholder="Room ID">

    <button onclick="joinRoom()">Join Room</button>
  </div>

  <!-- LOBBY -->
  <div id="lobby" class="hidden card">
    <h2>Lobby</h2>

    <div id="players"></div>

    <button id="startBtn" onclick="startGame()" class="hidden">
      Start Game
    </button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden card">

    <!-- TOP BAR -->
    <div class="top-bar">

      <div class="info-box">
        ⏱ Timer
        <span id="timer">10</span>
      </div>

      <div class="info-box">
        ⭐ Score
        <span id="score">0</span>
      </div>

    </div>

    <!-- QUESTION -->
    <div class="question-box">
      <h2 id="question"></h2>
    </div>

    <!-- OPTIONS -->
    <div id="options" class="options-grid"></div>

    <!-- BUTTONS -->
    <div class="navigation">

      <button id="backBtn">
        ⬅ Back
      </button>

      <button id="nextBtn">
        Next ➡
      </button>

    </div>

  </div>

  <!-- RESULT -->
  <div id="result" class="hidden card">
    <h2>Leaderboard 🏆</h2>
    <div id="scores"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
